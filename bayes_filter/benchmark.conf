# Benchmark settings for the Bayes filter / value iteration robot.
#
# run_benchmark.py replaces `{config}` with the config string and runs the command
# verbatim, so every flag the client needs (including -a) belongs in `configs` below.
#
# Speed tip: ./run.sh recompiles both JVMs on every run (~1 s). Add a --no-compile
# flag to run.sh, then append it to the config strings to skip that.

command = ["./run.sh", "{config}"]
runs = 50
timeout = 60

# Both JVMs stay alive after a game because of their Swing windows, so the harness
# kills the process group once an ends_run metric matches. drain_ms keeps reading
# briefly so the "It took N moves." line that follows Winner/Loser is not lost.
kill_when_done = true
drain_ms = 300

# Fail a run immediately instead of waiting for the timeout. AWT repaint errors are
# deliberately absent: they freeze the window but do not stop the game.
fatal = ["Address already in use", 'Exception in thread "main"']

configs = [
  "-w mundo_maze -u -m 0.99 -s 0.99 -a -d 0 --approach 1",
  "-w mundo_maze -u -m 0.99 -s 0.99 -a -d 0 --approach 2",
  "-w mundo_15_15 -u -m 0.99 -s 0.99 -a -d 0 --approach 1",
  "-w mundo_15_15 -u -m 0.99 -s 0.99 -a -d 0 --approach 2",
  "-w mundo_15_15 -u -m 0.90 -s 0.90 -a -d 0 --approach 1",
  "-w mundo_15_15 -u -m 0.90 -s 0.90 -a -d 0 --approach 2",
  "-w mundo_15_15 -u -m 0.50 -s 0.50 -a -d 0 --approach 1",
  "-w mundo_15_15 -u -m 0.50 -s 0.50 -a -d 0 --approach 2",
  # Compare the two action-selection approaches (`-A 1` expected utility, `-A 2` homing):
  # "-w mundo_maze -u -m 0.8 -s 0.8 -a -d 0 -A 2",
]

# Each metric becomes one table column.
#   flag   - one line matching `pattern` anywhere in the output marks the run (count + rate)
#   number - the last match in the run is read from capture group 1 (mean by default)
[metrics]
win   = { pattern = '^(Winner|I won!)$', kind = "flag", ends_run = true }
loss  = { pattern = '^(Loser|I lost!)$', kind = "flag", ends_run = true }
moves = { pattern = 'It took (\d+) moves\.', kind = "number", breakdown = "win" }
